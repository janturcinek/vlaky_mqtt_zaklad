
services:
  app:
    build: .
    image: prujezdy-vlaku:latest
    container_name: prujezdy-vlaku
    ports:
      - "127.0.0.1:5000:8000"
    volumes:
      - ./db:/app/db
      - ./data_storage:/app/data_storage
    environment:
      - SECRET_KEY=změňte_mě_na_tajný_řetězec_min_32_znaků
      - TZ=Europe/Prague
      # Volitelné přepsání MQTT brokeru — bez nastavení se použije výchozí
      # sdílený kurzovní broker definovaný v nastaveni.py.
      # - MQTT_HOST=vase-domena.example.com
      # - MQTT_PORT=1883
      # - MQTT_USERNAME=vase-uzivatelske-jmeno
      # - MQTT_PASSWORD=vase-heslo
    restart: unless-stopped
